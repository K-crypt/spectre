name: Deploy Next.js site to Pages

on:
  # Both branches deploy. main is where the work happens now; the merge that
  # brought the rebuild across resolved this file in favour of the redesign
  # branch's copy, so every push to main since has built nothing and needed a
  # manual dispatch to reach Pages.
  push:
    branches: ["main", "website-redesign"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build

      # A missing /<repo> prefix on one asset still builds, still returns 200,
      # and simply renders without the photograph. Fail here instead.
      - name: Check every asset carries the base path
        run: node scripts/check-base-path.mjs
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
