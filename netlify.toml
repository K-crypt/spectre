# The Spectre — site config
# Static Next.js export served from out/. No edge functions in production:
# the preview password gate (netlify/edge-functions/gate.ts) is unmapped since
# launch — an edge function on path /* bills one invocation per page view.
# To re-gate a preview: restore the [[edge_functions]] block below and set
# SITE_PASSWORD in the Netlify env.
#
#   [[edge_functions]]
#     function = "gate"
#     path = "/*"
#
# Deploys are ON-DEMAND ONLY (credit control): GitHub Actions "Run workflow"
# button, `gh workflow run deploy.yml --repo the-spectre-one/website`, or
# `npx -y netlify-cli deploy --prod --build` from this dir.

[build]
  command = "npm run build"
  publish = "out"
