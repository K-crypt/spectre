# Auto-deploy: every push to master builds and ships to Netlify via CLI.
# The repo is deliberately NOT linked in Netlify (private-org linking is paid);
# GitHub Actions pushes the build instead — same result, free tier.
# Requires one repo secret: NETLIFY_AUTH_TOKEN (Netlify → User settings →
# Applications → New access token). The site ID is not a secret.

name: Deploy to Netlify

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and deploy to Netlify
        run: npx -y netlify-cli deploy --prod --build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 23183e4b-5811-4185-9ab3-239eff6bf023
