# ON-DEMAND deploy: builds on GitHub's free runners, ships to Netlify via CLI.
# The repo is deliberately NOT linked in Netlify (private-org linking is paid),
# and per-push auto-deploy was retired 2026-07-22 to control Netlify credits —
# trigger manually: the "Run workflow" button on GitHub → Actions, or
#   gh workflow run deploy.yml --repo the-spectre-one/website
# Requires one repo secret: NETLIFY_AUTH_TOKEN (Netlify → User settings →
# Applications → New access token). The site ID is not a secret.

name: Deploy to Netlify

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and deploy to Netlify
        run: npx -y netlify-cli deploy --prod --build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 23183e4b-5811-4185-9ab3-239eff6bf023
